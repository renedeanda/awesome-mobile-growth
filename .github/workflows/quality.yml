name: Quality
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Generate and check types
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Audit public content
        run: npm run audit:content
      - name: Audit search and social metadata
        run: npm run audit:seo
      - name: Audit internal links
        run: npm run audit:links
      - name: Audit the AI skill package
        run: npm run audit:skills
      - name: Audit official documentation links
        run: npm run audit:external
      - name: Run browser tests
        run: npm run test:e2e
